# Fixed route across every terrain patch, map frame, meters.
# Pairs of points enter and exit each patch so the path must cross it.
# Heading at each goal faces the direction of travel.
name: terrain_tour
start: {x: -6.0, y: -1.0}
waypoints:
  - {name: bump_entry,  x: -3.8, y: -1.0}
  - {name: bump_exit,   x:  0.2, y: -1.0}
  - {name: rough_entry, x: -3.6, y:  4.0}
  - {name: rough_exit,  x: -8.4, y:  4.0}
  - {name: ramp_entry,  x: -3.0, y: -3.2}
  - {name: ramp_exit,   x: -3.0, y: -10.4}
